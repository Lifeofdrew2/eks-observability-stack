name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: "3.15.1"
  ALERTMANAGER_VERSION: "0.34.1"

jobs:
  prometheus:
    name: Rules, unit tests and configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install promtool and amtool
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 --wildcards '*/promtool'
          curl -sSfL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 --wildcards '*/amtool'
      - name: Check rule syntax
        run: ./promtool check rules prometheus/rules/*.yml
      - name: Unit-test alerts
        run: ./promtool test rules prometheus/tests/*.yml
      - name: Check Prometheus config
        run: ./promtool check config --syntax-only prometheus/prometheus.yml
      - name: Check Alertmanager config
        run: ./amtool check-config alertmanager/alertmanager.yml

  kubernetes:
    name: Generated manifests and dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Generated files are up to date
        run: python3 scripts/render_k8s.py --check
      - name: Dashboards are valid JSON
        run: for f in grafana/dashboards/*.json; do python3 -m json.tool "$f" >/dev/null && echo "ok $f"; done
      - name: Validate manifests (including CRDs)
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            kubernetes/servicemonitor.yaml kubernetes/generated/

  terraform:
    name: CloudWatch Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudwatch
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  compose:
    name: Local stack config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f local/docker-compose.yml config -q
