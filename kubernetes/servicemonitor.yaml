# Tells Prometheus to scrape demo-api's /metrics endpoint in every
# environment namespace. The resulting job label is the Service name,
# "demo-api", which the rules and dashboards filter on.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-api
  namespace: monitoring
  labels:
    app.kubernetes.io/name: demo-api
spec:
  namespaceSelector:
    matchNames: [demo, demo-staging, demo-production]
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
