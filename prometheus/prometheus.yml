# Prometheus configuration for the local Docker Compose stack.
# In Kubernetes, kube-prometheus-stack generates the equivalent config from
# ServiceMonitor and PrometheusRule objects (see kubernetes/).
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: demo-api
    metrics_path: /metrics
    static_configs:
      - targets: ["demo-api:8080"]
        labels:
          namespace: local

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
